<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pullmanss // 3D GitHub Galaxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Эффект сканлайнов монитора -->
    <div class="scanlines"></div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Кибер-интерфейс (HUD) -->
    <div class="hud-header">
        <div class="logo">
            <span class="blink">●</span> SYSTEM: ONLINE // USER: <span id="username-display">pullmanss</span>
        </div>
        <div class="stats-counter" id="stats-counter">SCANNING GALAXY...</div>
    </div>

    <div class="hud-instructions">
        [ ЛКМ + Перетаскивание ] Вращение &nbsp;|&nbsp; [ Колесо мыши ] Зум &nbsp;|&nbsp; [ Клик на звезду ] Инфо
    </div>

    <!-- Всплывающая карточка репозитория -->
    <div id="repo-card" class="repo-card hidden">
        <button class="close-btn" id="close-card">×</button>
        <div class="repo-badge" id="card-lang">UNKNOWN</div>
        <h2 id="card-title">REPOSITORY_NAME</h2>
        <p id="card-desc">No description provided.</p>
        <div class="repo-metrics">
            <span>★ Звёзды: <b id="card-stars">0</b></span>
            <span>⑂ Форки: <b id="card-forks">0</b></span>
            <span>⚡ Обновлён: <b id="card-date">-</b></span>
        </div>
        <a id="card-link" href="#" target="_blank" rel="noopener noreferrer" class="cyber-btn">
            OPEN IN GITHUB →
        </a>
    </div>

    <!-- Библиотеки Three.js и OrbitControls через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
