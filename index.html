<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pullmanss // Dev Terminal & Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Эффект интерактивных частиц на Canvas -->
    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <main class="terminal-container">
        <!-- Шапка профиля -->
        <header class="cyber-header">
            <div class="profile-info">
                <div class="avatar-box">
                    <img id="avatar" src="https://github.com/pullmanss.png" alt="Avatar">
                    <div class="status-indicator"></div>
                </div>
                <div>
                    <h1 class="glitch-text" id="user-name">pullmanss</h1>
                    <p class="role-badge">// SMART CONTRACTS & WEB3 SECURITY</p>
                    <div class="live-clock" id="clock">00:00:00 UTC</div>
                </div>
            </div>

            <div class="stats-hub">
                <div class="stat-card">
                    <span class="stat-label">REPOS</span>
                    <span class="stat-value" id="repo-count">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">FOLLOWERS</span>
                    <span class="stat-value" id="followers-count">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">SYSTEM</span>
                    <span class="stat-value text-green">ONLINE</span>
                </div>
            </div>
        </header>

        <!-- Панель поиска и фильтрации -->
        <section class="controls-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Поиск репозитория или технологии (например: Solidity)...">
            </div>
            <div class="quick-links">
                <a href="https://github.com/pullmanss" target="_blank" class="cyber-btn">GITHUB PROFILE ↗</a>
            </div>
        </section>

        <!-- Сетка проектов (наполняется через script.js) -->
        <section class="projects-grid" id="projects-container">
            <div class="loading-state">ЗАГРУЗКА РЕПОЗИТОРИЕВ ИЗ GITHUB API...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
