<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pullmanss // Dev Terminal & Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #060913;
            --panel-bg: rgba(13, 19, 36, 0.85);
            --border-color: rgba(0, 240, 255, 0.3);
            --cyan: #00f0ff;
            --purple: #b537f2;
            --green: #00ff88;
            --text-main: #d8e5f2;
            --text-dim: #768da6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновые анимированные частицы */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Сканлайны монитора */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        /* Главный контейнер */
        .terminal-container {
            position: relative;
            z-index: 2;
            max-width: 1050px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Шапка */
        .cyber-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar-box {
            position: relative;
            width: 76px;
            height: 76px;
            flex-shrink: 0;
        }

            .avatar-box img {
                width: 100%;
                height: 100%;
                border-radius: 10px;
                border: 2px solid var(--cyan);
                object-fit: cover;
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            }

        .status-indicator {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            background: var(--green);
            border: 2px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        .glitch-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .role-badge {
            font-size: 0.8rem;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .live-clock {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Статистика */
        .stats-hub {
            display: flex;
            gap: 15px;
        }

        .stat-card {
            background: rgba(6, 9, 19, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 18px;
            border-radius: 6px;
            text-align: center;
            min-width: 90px;
        }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .text-green {
            color: var(--green);
        }

        /* Поиск и кнопки */
        .controls-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            display: flex;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 15px;
        }

        .search-icon {
            margin-right: 10px;
            opacity: 0.6;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            padding: 14px 0;
            font-size: 0.9rem;
        }

        .cyber-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

            .cyber-btn:hover {
                background: var(--cyan);
                color: var(--bg-color);
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            }

        /* Сетка проектов */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(8px);
        }

            .repo-card:hover {
                transform: translateY(-4px);
                border-color: var(--cyan);
                box-shadow: 0 8px 25px rgba(0, 240, 255, 0.15);
            }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .repo-name {
            font-size: 1.15rem;
            color: #fff;
            word-break: break-all;
        }

        .repo-lang {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--cyan);
        }

        .repo-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

            .card-bottom a {
                color: var(--cyan);
                text-decoration: none;
                font-weight: 600;
            }

                .card-bottom a:hover {
                    text-decoration: underline;
                }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--cyan);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <main class="terminal-container">
        <header class="cyber-header">
            <div class="profile-info">
                <div class="avatar-box">
                    <img id="avatar" src="https://github.com/pullmanss.png" alt="Avatar">
                    <div class="status-indicator"></div>
                </div>
                <div>
                    <h1 class="glitch-text" id="user-name">pullmanss</h1>
                    <p class="role-badge">// SMART CONTRACTS & WEB3 SECURITY</p>
                    <div class="live-clock" id="clock">00:00:00 UTC</div>
                </div>
            </div>

            <div class="stats-hub">
                <div class="stat-card">
                    <span class="stat-label">REPOS</span>
                    <span class="stat-value" id="repo-count">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">FOLLOWERS</span>
                    <span class="stat-value" id="followers-count">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">SYSTEM</span>
                    <span class="stat-value text-green">ONLINE</span>
                </div>
            </div>
        </header>

        <section class="controls-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Поиск репозитория (например: Solidity)...">
            </div>
            <div class="quick-links">
                <a href="https://github.com/pullmanss" target="_blank" class="cyber-btn">GITHUB PROFILE ↗</a>
            </div>
        </section>

        <section class="projects-grid" id="projects-container">
            <div class="loading-state">СКАНИРОВАНИЕ РЕПОЗИТОРИЕВ...</div>
        </section>
    </main>

    <script>
            const GITHUB_USERNAME = 'pullmanss';
            let allRepos = [];

            document.addEventListener('DOMContentLoaded', () => {
              startClock();
              initCanvasParticles();
              loadGitHubData();

              document.getElementById('search-input').addEventListener('input', (e) => {
                filterRepos(e.target.value.toLowerCase());
              });
            });

            function startClock() {
              const clockEl = document.getElementById('clock');
              setInterval(() => {
                const now = new Date();
                clockEl.textContent = now.toUTCString().split(' ')[4] + ' UTC';
              }, 1000);
            }

            async function loadGitHubData() {
              try {
                const userRes = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}`);
                if (userRes.ok) {
                  const user = await userRes.json();
                  document.getElementById('user-name').textContent = user.name || user.login;
                  document.getElementById('followers-count').textContent = user.followers;
                }

                const repoRes = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
                if (!repoRes.ok) throw new Error('API Rate limit');
                allRepos = await repoRes.json();

                document.getElementById('repo-count').textContent = allRepos.length;
                renderRepos(allRepos);

              } catch (err) {
                console.warn('API fallback active:', err);
                allRepos = [
                  { name: 'pullmanss.github.io', language: 'JavaScript', stargazers_count: 5, description: 'Personal Cyberpunk Developer Hub & Portfolio', html_url: `https://github.com/${GITHUB_USERNAME}/pullmanss.github.io` },
                  { name: 'smart-contracts-sec', language: 'Solidity', stargazers_count: 14, description: 'DeFi security research, invariant fuzzing suite and audit checklist', html_url: '#' },
                  { name: 'web3-tooling', language: 'TypeScript', stargazers_count: 8, description: 'High-speed EVM transaction decoder and calldata analyzer', html_url: '#' }
                ];
                document.getElementById('repo-count').textContent = allRepos.length;
                renderRepos(allRepos);
              }
            }

            function renderRepos(repos) {
              const container = document.getElementById('projects-container');
              container.innerHTML = '';

              if (repos.length === 0) {
                container.innerHTML = '<div class="loading-state">ПРОЕКТЫ НЕ НАЙДЕНЫ</div>';
                return;
              }

              repos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                  <div>
                    <div class="card-top">
                      <h3 class="repo-name">${repo.name}</h3>
                      <span class="repo-lang">${repo.language || 'Code'}</span>
                    </div>
                    <p class="repo-desc">${repo.description || 'Описание проекта пока не добавлено.'}</p>
                  </div>
                  <div class="card-bottom">
                    <span>★ ${repo.stargazers_count || 0}</span>
                    <a href="${repo.html_url}" target="_blank">СМОТРЕТЬ КОД →</a>
                  </div>
                `;
                container.appendChild(card);
              });
            }

            function filterRepos(query) {
              const filtered = allRepos.filter(r =>
                r.name.toLowerCase().includes(query) ||
                (r.language && r.language.toLowerCase().includes(query)) ||
                (r.description && r.description.toLowerCase().includes(query))
              );
              renderRepos(filtered);
            }

            function initCanvasParticles() {
              const canvas = document.getElementById('bg-canvas');
              const ctx = canvas.getContext('2d');
              let width, height, particles;

              function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                particles = Array.from({ length: 65 }, () => ({
                  x: Math.random() * width,
                  y: Math.random() * height,
                  vx: (Math.random() - 0.5) * 0.4,
                  vy: (Math.random() - 0.5) * 0.4,
                  size: Math.random() * 2 + 1
                }));
              }

              window.addEventListener('resize', resize);
              resize();

              function animate() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#00f0ff';
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';

                for (let i = 0; i < particles.length; i++) {
                  const p = particles[i];
                  p.x += p.vx;
                  p.y += p.vy;

                  if (p.x < 0 || p.x > width) p.vx *= -1;
                  if (p.y < 0 || p.y > height) p.vy *= -1;

                  ctx.beginPath();
                  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                  ctx.fill();

                  for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 130) {
                      ctx.beginPath();
                      ctx.moveTo(p.x, p.y);
                      ctx.lineTo(p2.x, p2.y);
                      ctx.stroke();
                    }
                  }
                }
                requestAnimationFrame(animate);
              }
              animate();
            }
    </script>
</body>
</html>
